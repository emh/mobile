<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile</title>
  <meta name="description" content="A Calder-inspired physics puzzle. Set the balance point on each rod. How far can you go?" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://emh.io/mobile" />
  <meta property="og:title"       content="Mobile" />
  <meta property="og:description" content="A Calder-inspired physics puzzle. Set the balance point on each rod. How far can you go?" />
  <meta property="og:image"       content="https://emh.io/mobile/og.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Mobile" />
  <meta name="twitter:description" content="A Calder-inspired physics puzzle. Set the balance point on each rod. How far can you go?" />
  <meta name="twitter:image"       content="https://emh.io/mobile/og.png" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baumans&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="sheet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="overlay" id="title">mobile</div>

  <div class="overlay" id="stats">
    <div class="k">Level</div><div class="v" id="stLevel">1</div>
    <div class="k">Score</div><div class="v" id="stScore">&mdash;</div>
  </div>

  <div id="endBtns">
    <span id="gameOverLabel">game over</span>
    <button id="shareBtn"    type="button">share</button>
    <button id="startOverBtn" type="button">start over</button>
    <button id="nextLevelBtn" type="button">next level</button>
  </div>

  <div id="shareModal">
    <div class="share-card">
      <div id="sharePreview"></div>
      <p id="shareCaption"></p>
      <div class="share-actions">
        <button id="shareDoBtn"      type="button">share</button>
        <button id="shareCopyImgBtn" type="button">copy image</button>
        <button id="shareCloseBtn"   type="button">close</button>
      </div>
    </div>
  </div>

  <div id="intro">
    <div class="intro-card" role="dialog" aria-label="How to play">
      <h1>mobile</h1>
      <div class="intro-rule"></div>
      <svg class="intro-dia" viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="130" y1="18" x2="130" y2="50" class="string" />
        <g transform="rotate(7 130 50)">
          <line x1="46" y1="50" x2="214" y2="50" class="ln" />
          <circle cx="46"  cy="50" r="16" style="fill:#CC2200;stroke:#111;stroke-width:1.5" />
          <circle cx="214" cy="50" r="22" style="fill:#0033AA;stroke:#111;stroke-width:1.5" />
          <circle cx="46"  cy="50" r="2.4" class="dot" />
          <circle cx="214" cy="50" r="2.4" class="dot" />
        </g>
        <line x1="130" y1="50" x2="130" y2="110" class="string" />
        <g transform="rotate(-5 130 90)">
          <line x1="88" y1="90" x2="172" y2="90" class="ln" />
          <circle cx="88"  cy="90" r="12" style="fill:#F5C400;stroke:#111;stroke-width:1.5" />
          <circle cx="172" cy="90" r="18" style="fill:#CC2200;stroke:#111;stroke-width:1.5" />
          <circle cx="88"  cy="90" r="2" class="dot" />
          <circle cx="172" cy="90" r="2" class="dot" />
        </g>
      </svg>
      <p>Unequal weights hang from a mobile.</p>
      <p>Drag to place each <em>balance point</em> — start from the bottom, work up. Release to set. Aim for 0&deg; lean on every rod.</p>
      <p><em>Pinch to zoom &middot; drag to pan</em></p>
      <button type="button" id="beginBtn">begin</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script async data-id="101502386" src="//static.getclicky.com/js"></script>
</body>
</html>
