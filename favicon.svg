<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ceiling string -->
  <line x1="16" y1="2" x2="16" y2="9" stroke="#111" stroke-width="1.2" stroke-linecap="round"/>
  <!-- top rod (slightly tilted right) -->
  <path d="M6,9 Q16,10.5 26,9" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- left string -->
  <line x1="6" y1="9" x2="6" y2="17" stroke="#111" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <!-- right string -->
  <line x1="26" y1="9" x2="26" y2="17" stroke="#111" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <!-- left disc (red) -->
  <circle cx="6" cy="21" r="5" fill="#CC2200" stroke="#111" stroke-width="1"/>
  <!-- right sub-rod (slightly tilted left) -->
  <path d="M20,17 Q26,18.2 32,17" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
  <!-- right-left string -->
  <line x1="20" y1="17" x2="20" y2="25" stroke="#111" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <!-- right-right string -->
  <line x1="32" y1="17" x2="32" y2="24" stroke="#111" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <!-- bottom-left disc (blue) -->
  <circle cx="20" cy="28" r="4" fill="#0033AA" stroke="#111" stroke-width="1"/>
  <!-- bottom-right disc (yellow) -->
  <circle cx="32" cy="27" r="3.5" fill="#F5C400" stroke="#111" stroke-width="1"/>
</svg>
