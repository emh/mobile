<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="600" y="74" font-family="sans-serif" font-size="42" letter-spacing="18" text-anchor="middle" fill="#111111" opacity=".88">MOBILE</text>
  <rect x="577" y="85" width="46" height="1.5" fill="#111111" opacity=".2"/>

  <!-- Ceiling string -->
  <line x1="600" y1="130" x2="600" y2="185" stroke="#111111" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- Top rod (slightly right-heavy tilt) -->
  <path d="M280,185 Q600,198 860,185" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  <circle cx="600" cy="185" r="4" fill="#111111"/>

  <!-- Left arm string -->
  <line x1="280" y1="185" x2="280" y2="265" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  <!-- Right arm string -->
  <line x1="860" y1="185" x2="860" y2="265" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>

  <!-- Left disc (large blue) -->
  <circle cx="280" cy="340" r="75" fill="#0033AA" stroke="#111111" stroke-width="2"/>
  <circle cx="280" cy="265" r="4" fill="#111111"/>

  <!-- Right sub-rod (slight left tilt) -->
  <path d="M700,265 Q860,278 1020,265" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="860" cy="265" r="3.5" fill="#111111"/>

  <!-- Right-left string -->
  <line x1="700" y1="265" x2="700" y2="345" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  <!-- Right-right string -->
  <line x1="1020" y1="265" x2="1020" y2="335" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>

  <!-- Bottom-left disc (red, medium) -->
  <circle cx="700" cy="400" r="55" fill="#CC2200" stroke="#111111" stroke-width="2"/>
  <circle cx="700" cy="345" r="3.5" fill="#111111"/>

  <!-- Bottom-right disc (yellow, small) -->
  <circle cx="1020" cy="380" r="42" fill="#F5C400" stroke="#111111" stroke-width="2"/>
  <circle cx="1020" cy="335" r="3.5" fill="#111111"/>

  <!-- URL -->
  <text x="600" y="590" font-family="sans-serif" font-size="22" letter-spacing="6" text-anchor="middle" fill="#111111" opacity=".35">emh.io/mobile</text>
</svg>
